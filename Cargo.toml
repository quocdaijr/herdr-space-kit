[package]
name = "space-kit"
version = "0.7.0"
edition = "2024"
description = "Workspace groups, a grouped Agents tab and Claude/Codex usage for Herdr's sidebar"

[[bin]]
name = "space-kit"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
unicode-width = "0.2"

[profile.release]
opt-level = 2
